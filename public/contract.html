<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Internal client-agreement drafting tool for Palisade Writers LLC." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%8D%EF%B8%8F</text></svg>" />
<title>Palisade Agreement Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eff1ee;
    --surface:#ffffff;
    --surface-2:#f7f8f5;
    --ink:#202a28;
    --ink-soft:#55635f;
    --accent:#2e6e68;
    --accent-ink:#1d4b47;
    --rust:#b15a32;
    --border:#d9ded8;
    --blank:#a9b5ae;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 8px 24px -12px rgba(20,30,28,.18);
  }
  *{box-sizing:border-box;}
  .backlink{ display:inline-block; margin:14px 0 -6px 24px; font-family:'IBM Plex Sans', system-ui, sans-serif; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  .backlink:hover{ color:var(--accent-ink); text-decoration:underline; }
  @media print{ .backlink{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; }

  .page{ max-width:1320px; margin:0 auto; padding:28px 24px 80px; }

  .mobileTabs{ display:none; gap:8px; margin:16px 0; position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; }
  .mobileTabs button{ flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font:600 13px 'IBM Plex Sans'; cursor:pointer; }
  .mobileTabs button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .workspace{ display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:28px; margin-top:22px; align-items:start; }

  .formPane{ background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:20px 20px 24px; position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto; }
  .progress{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .progress .bar{ flex:1; height:5px; border-radius:3px; background:var(--border); overflow:hidden; }
  .progress .bar > i{ display:block; height:100%; background:var(--accent); width:0%; transition:width .25s ease; }
  .progress span{ font:500 11.5px 'IBM Plex Mono'; color:var(--ink-soft); white-space:nowrap; }

  fieldset{ border:0; margin:0 0 22px; padding:0; }
  fieldset legend{ font:600 11px 'IBM Plex Sans'; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-ink); margin-bottom:10px; padding:0; }
  .field{ margin-bottom:13px; }
  label.lbl{ display:block; font-size:12.5px; font-weight:500; color:var(--ink); margin-bottom:5px; }
  label.lbl .req{ color:var(--rust); margin-left:2px; }
  label.lbl .hint{ color:var(--ink-soft); font-weight:400; }

  input[type=text], input[type=number], input[type=date], textarea{
    width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font:400 13.5px 'IBM Plex Sans'; outline:none;
  }
  input[type=number]{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; }
  textarea{ resize:vertical; min-height:56px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, .radiorow input:focus-visible + span{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .radiorow{ display:flex; flex-wrap:wrap; gap:8px; }
  .radiorow label{ display:flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--border); border-radius:999px; font-size:12.5px; cursor:pointer; background:var(--surface); }
  .radiorow input{ accent-color:var(--accent); margin:0; }
  .radiorow label:has(input:checked){ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight:600; }

  .check{ display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--ink-soft); }
  .check input{ margin-top:2px; accent-color:var(--accent); }

  .subrow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .indent{ padding-left:2px; margin-top:10px; border-left:2px solid var(--border); padding-left:12px; }

  .toolbar{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .btn{ font:600 12.5px 'IBM Plex Sans'; padding:9px 14px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--border); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .copied{ font:500 11.5px 'IBM Plex Mono'; color:var(--accent-ink); align-self:center; }

  .previewPane{ min-width:0; }
  .preview{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:48px 52px; max-width:760px; margin:0 auto; font-family:'Source Serif 4', serif; }
  .preview h2.doctitle{ text-align:center; font-size:20px; margin:0 0 3px; letter-spacing:.01em; }
  .preview p.docsub{ text-align:center; font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Sans'; text-transform:uppercase; letter-spacing:.08em; margin:0 0 26px; }
  .preview .rule{ border:0; border-top:1px solid var(--border); margin:22px 0; }
  .preview p{ font-size:14.5px; line-height:1.65; margin:0 0 12px; }
  .preview h3{ font-size:14px; font-family:'IBM Plex Sans'; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-ink); margin:26px 0 8px; }
  .preview ul{ margin:0 0 12px; padding-left:20px; }
  .preview li{ font-size:14.5px; line-height:1.6; margin-bottom:6px; }
  .preview .filled{ font-weight:600; }
  .preview .blank{ color:var(--blank); border-bottom:1px dotted var(--blank); }
  .invoice{ border:1.5px solid var(--ink); border-radius:10px; padding:20px 22px; margin:16px 0 24px; background:var(--surface-2); font-family:'IBM Plex Sans'; }
  .invoice .invhead{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:12px; }
  .invoice .invhead h4{ margin:0; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); }
  .invoice .invhead .invno{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft); }
  .invoice .invrow{ display:flex; justify-content:space-between; gap:16px; font-size:13px; margin-bottom:6px; }
  .invoice .invrow span:first-child{ color:var(--ink-soft); }
  .invoice .invline{ display:flex; justify-content:space-between; gap:16px; font-size:13.5px; padding:8px 0; border-top:1px dashed var(--border); margin-top:8px; }
  .invoice .invtotal{ display:flex; justify-content:space-between; gap:16px; font-size:15px; font-weight:700; padding-top:10px; border-top:1.5px solid var(--ink); margin-top:8px; }
  .invoice .invnum{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; }
  .invoice .invfee{ font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:12px; line-height:1.55; }
  .sigblock{ margin-top:8px; }
  .sigimgwrap{ height:104px; display:flex; align-items:flex-end; margin-top:28px; }
  .sigimgwrap img{ height:92px; display:block; }
  .sigimgwrap .pending{ font-family:'IBM Plex Sans'; font-size:11px; color:var(--blank); font-style:italic; border:1px dashed var(--blank); border-radius:6px; padding:6px 10px; }
  .sigline{ border-top:1px solid var(--ink); margin-top:4px; padding-top:6px; font-family:'IBM Plex Sans'; font-size:11.5px; color:var(--ink-soft); }
  .sigline.client{ margin-top:38px; }
  .sigmeta{ font-family:'IBM Plex Sans'; font-size:12.5px; margin-top:14px; }
  .disclaimer{ margin-top:30px; font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Sans'; font-style:italic; }

  @media (max-width: 900px){
    .workspace{ grid-template-columns:1fr; }
    .mobileTabs{ display:flex; }
    .formPane{ position:static; max-height:none; }
    .formPane, .previewPane{ display:none; }
    body.tab-form .formPane{ display:block; }
    body.tab-preview .previewPane{ display:block; }
    .preview{ padding:30px 22px; }
  }

  @media print{
    .mobileTabs, .formPane, .toolbar{ display:none !important; }
    .previewPane{ display:block !important; }
    body, .page{ background:#fff; padding:0; margin:0; }
    .workspace{ display:block !important; }
    .preview{ display:block !important; box-shadow:none; border:none; padding:0; max-width:none; }
    .preview p{ font-size:11.5px; line-height:1.35; margin:0 0 6px; }
    .preview li{ font-size:11.5px; line-height:1.3; margin-bottom:3px; }
    .preview h3{ font-size:11px; margin:12px 0 5px; }
    .preview .doctitle{ font-size:16px; margin-bottom:2px; }
    .preview .docsub{ font-size:10.5px; margin-bottom:14px; }
    .preview .rule{ margin:12px 0; }
    .invoice{ padding:12px 14px; margin:8px 0 12px; }
    .invoice .invhead{ padding-bottom:6px; margin-bottom:8px; }
    .invoice .invrow{ font-size:10.5px; margin-bottom:4px; }
    .invoice .invline{ font-size:11px; padding:5px 0; margin-top:5px; }
    .invoice .invtotal{ font-size:12px; padding-top:6px; margin-top:5px; }
    .invoice .invfee{ font-size:9.5px; margin-top:6px; line-height:1.3; }
    .sigimgwrap{ height:80px; margin-top:16px; }
    .sigimgwrap img{ height:68px; }
    .invoice-appendix{ break-before: page; }
    .sigline{ margin-top:2px; padding-top:3px; font-size:10px; }
    .sigline.client{ margin-top:22px; }
    .sigmeta{ font-size:10.5px; margin-top:8px; }
    .disclaimer{ margin-top:16px; font-size:9.5px; }
    @page{ margin:0.6in; }
  }
</style>
</head>
<body>
<a href="/" class="backlink">&larr; palisadewriters.com</a>
<div class="page">
  <div class="mobileTabs">
    <button id="tabFormBtn" class="active">Fill in details</button>
    <button id="tabPreviewBtn">Preview agreement</button>
  </div>

  <div class="workspace">
    <div class="formPane" id="formPane">
      <div class="progress">
        <div class="bar"><i id="progressBar"></i></div>
        <span id="progressLabel">0%</span>
      </div>

      <form id="theForm">
        <fieldset>
          <legend>Parties</legend>
          <div class="field">
            <label class="lbl">Company status</label>
            <label class="check">
              <input type="checkbox" id="llcApproved">
              <span>LLC formation has been officially approved by New York State (leave unchecked while pending)</span>
            </label>
          </div>
          <div class="field">
            <label class="lbl">Tutor for this engagement <span class="req">*</span></label>
            <div class="radiorow" id="tutorRadios">
              <label><input type="radio" name="tutor" value="Abigail Melick"><span>Abigail Melick</span></label>
              <label><input type="radio" name="tutor" value="Jacob Goldwasser" checked><span>Jacob Goldwasser</span></label>
              <label><input type="radio" name="tutor" value="Other"><span>Other</span></label>
            </div>
            <div class="indent" id="tutorOtherWrap" style="display:none;">
              <input type="text" id="tutorOther" placeholder="Tutor's full name">
            </div>
          </div>
          <div class="field">
            <label class="lbl" for="clientName">Client / parent or guardian name <span class="req">*</span></label>
            <input type="text" id="clientName" placeholder="e.g. Jane Smith">
          </div>
          <div class="field">
            <label class="lbl" for="studentName">Student name <span class="hint">(if different from client)</span></label>
            <input type="text" id="studentName" placeholder="e.g. Alex Smith">
          </div>
          <div class="field">
            <label class="lbl" for="effDate">Effective date</label>
            <input type="date" id="effDate">
          </div>
        </fieldset>

        <fieldset>
          <legend>Services</legend>
          <div class="field">
            <label class="lbl" for="subject">Subject / focus area <span class="req">*</span></label>
            <input type="text" id="subject" placeholder="e.g. AP U.S. History &amp; college essays">
          </div>
          <div class="field">
            <label class="lbl">Format <span class="req">*</span></label>
            <div class="radiorow" id="formatRadios">
              <label><input type="radio" name="format" value="standard" checked><span>Zoom / async (default)</span></label>
              <label><input type="radio" name="format" value="inPerson"><span>In-person</span></label>
              <label><input type="radio" name="format" value="other"><span>Other (specify)</span></label>
            </div>
            <div class="indent" id="locationWrap" style="display:none;">
              <label class="lbl" for="location">In-person location</label>
              <input type="text" id="location" placeholder="e.g. client's home in Brooklyn, or a local library">
            </div>
            <div class="indent" id="otherFormatWrap" style="display:none;">
              <label class="lbl" for="otherFormat">Describe the arrangement</label>
              <input type="text" id="otherFormat" placeholder="e.g. weekly phone calls, plus async feedback via email">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Pricing &amp; payment</legend>
          <div class="field">
            <div class="radiorow" id="pricingRadios">
              <label><input type="radio" name="pricing" value="hourly" checked><span>Hourly &mdash; $290/hr</span></label>
              <label><input type="radio" name="pricing" value="package"><span>Package</span></label>
            </div>
          </div>

          <div id="hourlyWrap" class="indent">
            <label class="lbl" for="hourlyRate">Hourly rate ($)</label>
            <input type="number" id="hourlyRate" value="290" min="0" step="5">
            <p class="lbl" style="margin-top:8px;color:var(--ink-soft);font-weight:400;">First session due upfront; each session after that billed via Venmo or Zelle within 48 hours.</p>
            <div class="field" style="margin-top:10px;">
              <label class="lbl" for="invoiceSessions">Sessions to invoice <span class="hint">(for standalone invoice only)</span></label>
              <input type="number" id="invoiceSessions" min="1" step="1" placeholder="e.g. 4">
            </div>
          </div>

          <div id="packageWrap" class="indent" style="display:none;">
            <label class="lbl">Tier</label>
            <div class="radiorow" id="tierRadios">
              <label><input type="radio" name="tier" value="Light" checked><span>Light</span></label>
              <label><input type="radio" name="tier" value="Standard"><span>Standard</span></label>
              <label><input type="radio" name="tier" value="Comprehensive"><span>Comprehensive</span></label>
            </div>
            <div class="subrow" style="margin-top:10px;">
              <div class="field">
                <label class="lbl" for="pkgSessions">Virtual sessions included <span class="hint">(optional)</span></label>
                <input type="number" id="pkgSessions" min="1" step="1" placeholder="e.g. 8">
              </div>
              <div class="field">
                <label class="lbl" for="pkgAsyncCycles">Async feedback cycles <span class="hint">(optional)</span></label>
                <input type="number" id="pkgAsyncCycles" min="1" step="1" placeholder="e.g. 3">
              </div>
            </div>
            <div class="field">
              <label class="lbl" for="pkgPrice">Total price ($)</label>
              <input type="number" id="pkgPrice" min="0" step="10" placeholder="e.g. 2200">
            </div>
            <div class="field">
              <label class="lbl" for="pkgIncludes">What's included <span class="hint">(optional)</span></label>
              <textarea id="pkgIncludes" placeholder="e.g. weekly 60-minute sessions, essay outlining, two full-length practice exams"></textarea>
            </div>
            <p class="lbl" style="margin-top:2px;color:var(--ink-soft);font-weight:400;">Due in full, upfront, before the first session in the package.</p>
          </div>
        </fieldset>

        <fieldset>
          <legend>Legal details</legend>
          <div class="field">
            <label class="lbl">Governing law</label>
            <input type="text" value="State of New York" disabled style="opacity:.75;">
          </div>
          <div class="field">
            <label class="lbl" for="notes">Additional terms <span class="hint">(optional)</span></label>
            <textarea id="notes" placeholder="Anything specific to this engagement not covered above"></textarea>
          </div>
        </fieldset>
      </form>

      <div class="toolbar">
        <button class="btn btn-primary" id="printBtn">Print / Save as PDF</button>
        <button class="btn btn-ghost" id="copyBtn">Copy contract text</button>
        <button class="btn btn-ghost" id="invoiceOnlyBtn">Invoice only</button>
        <button class="btn btn-ghost" id="resetBtn">Reset</button>
        <span class="copied" id="copiedMsg" style="display:none;">Copied!</span>
      </div>
    </div>

    <div class="previewPane" id="previewPane">
      <div class="preview" id="preview"></div>
    </div>
  </div>
</div>

  const $ = id => document.getElementById(id);
  const form = $('theForm');

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function f(val, placeholder){
    const v = (val ?? '').toString().trim();
    return v ? '<span class="filled">' + esc(v) + '</span>' : '<span class="blank">' + esc(placeholder) + '</span>';
  }
  function radioVal(name){
    const el = form.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : '';
  }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  }
  function money(n){
    const num = Number(n);
    if(!n || isNaN(num)) return '';
    return '$' + num.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  // conditional field visibility
  form.addEventListener('change', (e) => {
    if(e.target.name === 'tutor'){
      $('tutorOtherWrap').style.display = e.target.value === 'Other' ? 'block' : 'none';
    }
    if(e.target.name === 'format'){
      const v = radioVal('format');
      $('locationWrap').style.display = v === 'inPerson' ? 'block' : 'none';
      $('otherFormatWrap').style.display = v === 'other' ? 'block' : 'none';
    }
    if(e.target.name === 'pricing'){
      const v = radioVal('pricing');
      $('hourlyWrap').style.display = v === 'hourly' ? 'block' : 'none';
      $('packageWrap').style.display = v === 'package' ? 'block' : 'none';
    }
  });

  // default effective date = today
  $('effDate').value = new Date().toISOString().slice(0,10);

  const REQUIRED_IDS = ['clientName','subject'];
  function computeProgress(){
    let total = 10, done = 0;
    if(radioVal('tutor') === 'Other' ? $('tutorOther').value.trim() : radioVal('tutor')) done++;
    if($('clientName').value.trim()) done++;
    if($('effDate').value) done++;
    if($('subject').value.trim()) done++;
    const fmt = radioVal('format');
    if(fmt === 'inPerson') done += $('location').value.trim() ? 1 : 0;
    else if(fmt === 'other') done += $('otherFormat').value.trim() ? 1 : 0;
    else done += 1; // standard (Zoom/async) needs no extra field
    const pricing = radioVal('pricing');
    if(pricing === 'hourly'){ if($('hourlyRate').value) done++; }
    else { if($('pkgPrice').value && ($('pkgSessions').value || $('pkgAsyncCycles').value)) done++; }
    done += 2; // format-selected, pricing-selected baseline (always chosen, radios default)
    total = 8;
    done = Math.min(done, total);
    const pct = Math.round((done/total) * 100);
    $('progressBar').style.width = pct + '%';
    $('progressLabel').textContent = pct + '%';
  }

  function companyLine(){
    return $('llcApproved').checked
      ? 'Palisade Writers LLC, a New York limited liability company ("Company")'
      : 'Palisade Writers ("Company")';
  }

  function tutorName(){
    return radioVal('tutor') === 'Other' ? $('tutorOther').value.trim() : radioVal('tutor');
  }

  function formatSentence(){
    const v = radioVal('format');
    if(v === 'inPerson') return 'Sessions are conducted in person at ' + f($('location').value, '[location to be specified]') + '.';
    if(v === 'other') return f($('otherFormat').value, '[arrangement to be specified]') + '.';
    return 'Sessions are conducted over Zoom, or asynchronously via Google Docs or a similar shared-document platform, unless otherwise specified in this Agreement.';
  }

  function packageSessionsText(){
    const parts = [];
    const sessions = $('pkgSessions').value;
    const cycles = $('pkgAsyncCycles').value;
    if(sessions) parts.push(esc(sessions) + ' virtual session' + (Number(sessions) === 1 ? '' : 's'));
    if(cycles) parts.push(esc(cycles) + ' asynchronous feedback cycle' + (Number(cycles) === 1 ? '' : 's'));
    return parts.join(' and ');
  }

  function pricingBlock(){
    const v = radioVal('pricing');
    if(v === 'hourly'){
      const rate = $('hourlyRate').value;
      return '<p><strong>Rate:</strong> ' + f(rate ? money(rate) + ' per hour' : '', '[rate]') +
        '. Client will be billed by session. Other than the first session, which is due upfront per above, payment ' +
        'for each session is due via Venmo or Zelle within 48 hours of that session.</p>';
    }
    const tier = radioVal('tier');
    const price = $('pkgPrice').value;
    const includes = $('pkgIncludes').value.trim();
    const sessionsText = packageSessionsText();
    let out = '<p><strong>Package:</strong> ' + esc(tier) + (sessionsText ? ' &mdash; ' + sessionsText : '') +
      ' for ' + f(price ? money(price) : '', '[total price]') + '.</p>';
    if(includes) out += '<p><strong>Includes:</strong> ' + esc(includes) + '.</p>';
    out += '<p>Package fees are due in full, upfront, before the first session in the package. Packages are non-refundable once sessions have begun, but unused sessions may be rescheduled per the cancellation policy below.</p>';
    const hourlyRate = $('hourlyRate').value;
    out += '<p>Additional sessions beyond those included in this package may be purchased at Tutor\'s standard hourly rate of ' +
      f(hourlyRate ? money(hourlyRate) + '/hr' : '', '[hourly rate]') + '.</p>';
    return out;
  }

  function invoiceNumber(){
    const iso = $('effDate').value ? $('effDate').value.replace(/-/g, '') : '00000000';
    const pricing = radioVal('pricing');
    const tag = pricing === 'package' ? (radioVal('tier') || 'X').charAt(0).toUpperCase() : 'H';
    return 'PT-' + iso + '-' + tag;
  }

  function buildInvoiceHTML(){
    const pricing = radioVal('pricing');
    const client = $('clientName').value.trim();
    const student = $('studentName').value.trim();
    let lineLabel, amount, dueText;
    if(pricing === 'package'){
      const tier = radioVal('tier');
      const price = $('pkgPrice').value;
      const sessionsText = packageSessionsText();
      lineLabel = esc(tier) + ' package' + (sessionsText ? ' &mdash; ' + sessionsText : '');
      amount = price ? money(price) : '[total price]';
      dueText = 'Upfront, before the first session';
    } else {
      const rate = $('hourlyRate').value;
      const sessions = $('invoiceSessions').value;
      const total = (rate && sessions) ? (Number(rate) * Number(sessions)) : null;
      lineLabel = (sessions ? esc(sessions) + ' session' + (Number(sessions) === 1 ? '' : 's') : '[# of sessions]') + ' at ' + (rate ? money(rate) : '[rate]') + '/hr';
      amount = total !== null ? money(total) : '[total price]';
      dueText = 'Within 48 hours of this invoice';
    }
    return `
      <div class="invoice">
        <div class="invhead">
          <h4>Invoice</h4>
          <span class="invno">No. ${esc(invoiceNumber())} &nbsp;&middot;&nbsp; ${esc(fmtDate($('effDate').value) || '[effective date]')}</span>
        </div>
        <div class="invrow"><span>Bill to</span><span>${f(client, '[client / parent or guardian name]')}${student ? ' (for ' + esc(student) + ')' : ''}</span></div>
        <div class="invrow"><span>From</span><span>${companyLine().replace(/ \("Company"\)$/,'')}</span></div>
        <div class="invrow"><span>Payment due</span><span>${dueText}</span></div>
        <div class="invrow"><span>Payment methods</span><span>Venmo, Zelle, or bank transfer</span></div>
        <div class="invline">
          <span>${lineLabel}</span>
          <span class="invnum">${amount}</span>
        </div>
        <div class="invtotal"><span>Total due</span><span class="invnum">${amount}</span></div>
        <p class="invfee">Client is responsible for any credit card processing fees, foreign transaction fees, or
        bank/wire transfer fees incurred in sending payment. The amount received by ${companyLine().replace(/ \("Company"\)$/,'')}
        must equal the Total Due above, net of any such fees.</p>
      </div>
    `;
  }

  function invoiceBlock(){
    if(radioVal('pricing') !== 'package') return '';
    return buildInvoiceHTML();
  }

  function standaloneInvoiceDoc(){
    return `
      <h2 class="doctitle">${companyLine().replace(/ \("Company"\)$/,'')}</h2>
      <p class="docsub">Invoice</p>
      ${buildInvoiceHTML()}
      <p class="disclaimer">Questions about this invoice? Contact ${f(tutorName(), '[tutor name]')}.</p>
    `;
  }

  function cancellationBlock(){
    return '<p>Either party must give at least 48 hours\' notice to cancel or reschedule a scheduled session, except in cases of illness or genuine emergency, which will be handled on a case-by-case basis.</p>';
  }

  function render(){
    computeProgress();
    if(previewMode === 'invoice'){
      $('preview').innerHTML = standaloneInvoiceDoc();
      return;
    }
    const student = $('studentName').value.trim();
    const notes = $('notes').value.trim();
    const invHtml = invoiceBlock();

    const html = `
      <h2 class="doctitle">${companyLine().replace(/ \("Company"\)$/,'')}</h2>
      <p class="docsub">Tutoring &amp; Academic Coaching Services Agreement</p>

      <p>This Tutoring &amp; Academic Coaching Services Agreement ("Agreement") is entered into as of
      ${f(fmtDate($('effDate').value), '[effective date]')}, between ${companyLine()}, acting through
      ${f(tutorName(), '[tutor name]')} ("Tutor"), and
      ${f($('clientName').value, '[client / parent or guardian name]')} ("Client")${student ? ', on behalf of ' + f(student, '') : ''}.</p>

      <h3>1. Services</h3>
      <p>Tutor will provide academic tutoring and/or coaching services in the following subject or focus area:
      ${f($('subject').value, '[subject / focus area]')}. The specific scope and goals of sessions will be discussed
      and may be adjusted over time by mutual agreement.</p>
      <p>Tutor will, under no circumstances, compose text on the Student's behalf. All essays and other written work
      must be the Student's own, and must comply with all relevant academic integrity and ethical guidelines,
      including those of the Student's school and any college admissions process.</p>

      <h3>2. Session Format &amp; Scheduling</h3>
      <p>${formatSentence()} Sessions are scheduled by mutual agreement, subject to both parties' availability.
      A parent or guardian may join any session to observe at any time.</p>

      <h3>3. Pricing &amp; Payment</h3>
      <p>Payment is due in full before the first session between Tutor and Student takes place, regardless of the
      pricing structure selected below.</p>
      ${pricingBlock()}
      <p>Rates and package prices are subject to change with at least 30 days' written notice to Client for any
      sessions not yet scheduled or packages not yet purchased.</p>

      <h3>4. Cancellation &amp; Rescheduling Policy</h3>
      ${cancellationBlock()}

      <h3>5. Materials &amp; Preparation</h3>
      <p>To support the Student's progress, Client agrees to share relevant materials as available, which may
      include recent writing samples, teacher feedback, diagnostic evaluations or learning plans, and assignment
      guidelines or rubrics. Tutor will use these materials solely to inform tutoring sessions.</p>

      <h3>6. Confidentiality</h3>
      <p>Tutor will treat all information about the Student &mdash; including academic records, evaluations, diagnoses,
      and personal circumstances shared in connection with these services &mdash; as confidential, and will not disclose
      such information to third parties without Client's consent, except as required by law or to protect the
      Student's safety.</p>

      <h3>7. Client Rights</h3>
      <ul>
        <li>The right to receive services performed with reasonable care and professional good faith.</li>
        <li>The right for a parent or guardian to join any session to observe, at any time.</li>
        <li>The right to the confidentiality described in Section 6 above.</li>
        <li>The right to the same 48-hour cancellation standard from Tutor that Client is held to (Section 4).</li>
        <li>The right to at least 30 days' notice before any rate or package-price change affects future sessions.</li>
        <li>The right to request that any materials shared under Section 5 be returned or deleted once the
        engagement ends.</li>
      </ul>

      <h3>8. Independent Contractor</h3>
      <p>Tutor provides services as an independent contractor and not as an employee, agent, or partner of Client.
      Tutor is responsible for their own taxes and does not provide services through, or on behalf of, any school or
      educational institution unless separately agreed in writing.</p>

      <h3>9. No Guarantee of Results</h3>
      <p>Tutor will make good-faith, professional efforts to support the Student's academic growth. Tutor does not
      guarantee specific grades, test scores, admissions outcomes, or other results, as these depend on many factors
      outside Tutor's control.</p>

      <h3>10. Termination</h3>
      <p>Either party may terminate this Agreement at any time with written notice (email is sufficient). Client
      remains responsible for payment of all sessions completed, and any package fees earned, prior to
      termination.</p>

      <h3>11. Limitation of Liability</h3>
      <p>Company's and Tutor's liability under this Agreement is limited to the amount of fees paid by Client for
      the services giving rise to the claim. Neither is liable for indirect, incidental, or consequential
      damages.</p>

      <h3>12. Governing Law</h3>
      <p>This Agreement is governed by the laws of the State of New York, without regard to its conflict-of-law
      principles.</p>

      <h3>13. Additional Terms</h3>
      <p>${notes ? esc(notes) : '<span class="blank">None specified for this engagement.</span>'}</p>

      <h3>14. Entire Agreement</h3>
      <p>This Agreement constitutes the entire understanding between the parties regarding tutoring services and
      supersedes any prior oral or written agreements on the subject. Any changes must be made in writing and
      signed, or agreed via email, by both parties.</p>
      ${invHtml ? '<div class="invoice-appendix">' + invHtml + '</div>' : ''}

      <hr class="rule">
      <h3>Signatures</h3>
      <div class="sigblock">
        <div class="sigimgwrap">${TUTOR_SIGNATURE_DATA_URI ? '<img src="' + TUTOR_SIGNATURE_DATA_URI + '" alt="Tutor signature">' : '<span class="pending">[signature image not yet added]</span>'}</div>
        <div class="sigline">For ${companyLine().replace(/ \("Company"\)$/,'')}, by ${f(tutorName(), '[tutor name]')} (Tutor)</div>
        <p class="sigmeta">Print name: <strong>${f(tutorName(), '[tutor name]')}</strong>&nbsp;&nbsp;&nbsp;&nbsp;Date: <strong>${f(fmtDate($('effDate').value), '[date]')}</strong></p>

        <div class="sigline client">${f($('clientName').value, '[client / parent or guardian name]')} (Client)</div>
        <p class="sigmeta">Print name: _______________________________&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________</p>
      </div>

      <p class="disclaimer">This is a general-purpose template, not legal advice. Consider having a licensed New
      York attorney review it before use &mdash; particularly once the LLC formation is confirmed.</p>
    `;
    $('preview').innerHTML = html;
  }

  form.addEventListener('input', render);
  form.addEventListener('change', render);
  render();

  // toolbar actions
  function suggestedFilename(){
    const client = ($('clientName').value || 'Client').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_');
    const dateStr = $('effDate').value || new Date().toISOString().slice(0,10);
    const kind = previewMode === 'invoice' ? 'Palisade_Invoice' : 'Palisade_Agreement';
    return client + '_' + kind + '_' + dateStr;
  }
  $('printBtn').addEventListener('click', () => {
    const originalTitle = document.title;
    document.title = suggestedFilename();
    const restore = () => { document.title = originalTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 2000);
  });
  $('resetBtn').addEventListener('click', () => {
    form.reset();
    $('effDate').value = new Date().toISOString().slice(0,10);
    $('tutorOtherWrap').style.display = 'none';
    $('locationWrap').style.display = 'none';
    $('otherFormatWrap').style.display = 'none';
    $('hourlyWrap').style.display = 'block';
    $('packageWrap').style.display = 'none';
    previewMode = 'contract';
    $('invoiceOnlyBtn').textContent = 'Invoice only';
    render();
  });
  $('invoiceOnlyBtn').addEventListener('click', () => {
    previewMode = previewMode === 'invoice' ? 'contract' : 'invoice';
    $('invoiceOnlyBtn').textContent = previewMode === 'invoice' ? 'Show full contract' : 'Invoice only';
    render();
  });
  $('copyBtn').addEventListener('click', async () => {
    const text = $('preview').innerText;
    try{
      await navigator.clipboard.writeText(text);
      $('copiedMsg').style.display = 'inline';
      setTimeout(() => { $('copiedMsg').style.display = 'none'; }, 1800);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
      $('copiedMsg').style.display = 'inline';
      setTimeout(() => { $('copiedMsg').style.display = 'none'; }, 1800);
    }
  });

  // mobile tabs
  const tabForm = $('tabFormBtn'), tabPreview = $('tabPreviewBtn');
  function setTab(t){
    document.body.classList.toggle('tab-form', t === 'form');
    document.body.classList.toggle('tab-preview', t === 'preview');
    tabForm.classList.toggle('active', t === 'form');
    tabPreview.classList.toggle('active', t === 'preview');
  }
  tabForm.addEventListener('click', () => setTab('form'));
  tabPreview.addEventListener('click', () => setTab('preview'));
  setTab('form');
})();
</script>

</body>
</html>
